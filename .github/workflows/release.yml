name: release

on:
  push:
    tags:
      # Publish on any tag starting with a `v`, e.g., v0.1.0
      - v*

jobs:
  run:
    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set release version
        run: |
          GITTAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "GITTAG_VERSION=$GITTAG_VERSION" >> $GITHUB_ENV

      - name: Verify pyproject.toml version matches tag
        run: |
          PYPROJECT_VERSION=$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)

          print(data["project"]["version"])
          PY
          )

          echo "Tag version:        $GITTAG_VERSION"
          echo "pyproject version:  $PYPROJECT_VERSION"

          if [ "$GITTAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "Version mismatch"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Build
        run: uv build

      - name: Verify built wheel metadata version
        run: |
          WHEEL_VERSION=$(unzip -p dist/*.whl '*/METADATA' \
            | grep '^Version:' \
            | awk '{print $2}')

          echo "Expected version: $GITTAG_VERSION"
          echo "Wheel version:    $WHEEL_VERSION"

          if [ "$GITTAG_VERSION" != "$WHEEL_VERSION" ]; then
            echo "Wheel metadata version mismatch"
            exit 1
          fi

      # Check that basic features work and we didn't miss to include crucial files
      - name: Smoke test (wheel)
        run:
          uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py

      - name: Smoke test (source distribution)
        run:
          uv run --isolated --no-project --with dist/*.tar.gz
          tests/smoke_test.py

      - name: Publish
        run: uv publish
